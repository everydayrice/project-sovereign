name: Deploy Project Sovereign

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "wrangler.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-sovereign-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate code and regression tests
        run: |
          npm run build
          npm test
      - name: Verify Cloudflare deployment authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The repository is missing the CLOUDFLARE_API_TOKEN Actions secret. Deployment has not been attempted."
            exit 1
          fi
      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b335ec693fe163eaf8af9d42053e00fa
          CI: "true"
        run: npx --yes wrangler@4 deploy
      - name: Verify live health
        run: |
          node --input-type=module -e '
            const url="https://project-sovereign.ricecloud.workers.dev/health";
            const res=await fetch(url,{headers:{accept:"application/json"},signal:AbortSignal.timeout(20000)});
            const data=await res.json();
            if(!res.ok || data.status!=="ok"){console.error("Sovereign health check failed",res.status,JSON.stringify(data));process.exit(1)}
            console.log("Sovereign production health verified:",JSON.stringify(data));
          '
