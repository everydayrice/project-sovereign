name = "project-sovereign"
main = "src/worker-entry.mjs"
compatibility_date = "2026-09-03"
keep_vars = true

[secrets]
required = ["DATABASE_URL"]

[vars]
NEON_AUTH_BASE_URL = "https://ep-purple-glitter-ay6mb14n.neonauth.c-5.us-east-2.aws.neon.tech/neondb/auth"
NEON_AUTH_JWKS_URL = "https://ep-purple-glitter-ay6mb14n.neonauth.c-5.us-east-2.aws.neon.tech/neondb/auth/.well-known/jwks.json"

[[r2_buckets]]
binding = "SOVEREIGN_FILES"
bucket_name = "project-sovereign-files"

# DATABASE_URL is intentionally not committed. Configure it as a Cloudflare
# Worker secret for the dedicated PROJECT SOVEREIGN Neon production branch.
# Never point this Worker at RICE Lightning or legacy RICE Command storage.
